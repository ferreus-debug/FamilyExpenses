name: Deploy

# Runs after CI has passed on main (i.e. after a pull request is merged) and installs the
# linux-arm64 build from that CI run on the Raspberry Pi through a self-hosted runner.
# Never runs for pull requests, so code from unmerged branches never reaches the Pi.
#
# Each build lands in its own folder (/opt/familyexpenses/releases/<release>) and a symlink is
# swapped, so going back is instant: if the new release doesn't come up healthy it is rolled back
# automatically and this job fails. Manual rollback: the "Rollback" workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  # The deploy runs on the Pi's own runner, so an offline runner leaves that job sitting in the queue
  # while CI is green: a merge looks fine and never reaches the Pi (wowanalyser hit this after the
  # runner auto-updated and GitHub dropped its registration). This watchdog runs alongside the deploy
  # (not as a dependency – that would deadlock) and fails the run with the fix if the Pi hasn't picked
  # the job up. The queued deploy still lands by itself if the runner comes back later.
  deploy-watchdog:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Pi's runner to pick up the deploy
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs
        run: |
          for _ in $(seq 1 20); do   # 20 × 15s = 5 minutes
            status=$(gh api "$JOBS_URL" --jq '.jobs[] | select(.name == "deploy") | .status')
            case "$status" in
              in_progress|completed) echo "The deploy job is running on the Pi."; exit 0 ;;
            esac
            sleep 15
          done
          {
            echo "::error::The Pi never picked up the deploy – its self-hosted runner is offline."
            echo "### Deploy is stuck in the queue: the Pi's runner is offline"
            echo
            echo 'Check it on the Pi: `systemctl is-active actions.runner.ferreus-debug-FamilyExpenses.pi-familyexpenses.service`'
            echo
            echo "Re-register it (GitHub deletes the registration after a long offline stretch) – on your PC:"
            echo '```bash'
            echo "gh api -X POST repos/${{ github.repository }}/actions/runners/registration-token --jq .token"
            echo '```'
            echo '```bash'
            echo 'scp deploy/setup-runner.sh pi@192.168.68.53:/tmp/ && ssh pi@192.168.68.53 "bash /tmp/setup-runner.sh <token>"'
            echo '```'
            echo
            echo "The queued deploy starts by itself once the runner is back. See deploy/README.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, pi, familyexpenses]
    environment:
      name: production
      url: https://turkassen.mathiasspangsberg.com
    env:
      PORT: ${{ vars.PI_PORT || '5080' }}
    steps:
      # Same name CI stamped into the build (r<run>-<sha>), which /version reports back.
      - name: Release name
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "RELEASE=r${RUN_NUMBER}-${SHA::7}" >> "$GITHUB_ENV"

      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: deploy

      - name: Download the build from CI
        uses: actions/download-artifact@v4
        with:
          name: familyexpenses-linux-arm64
          path: release/app
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare release folder
        run: |
          cp -r deploy release/deploy
          # Artifacts do not keep the executable bit.
          chmod +x release/app/FamilyExpenses.Web release/deploy/*.sh

      # Goes live, checks /healthz and /version, and rolls back by itself (failing the job) if not.
      - name: Install and go live
        run: sudo release/deploy/familyexpenses-deploy.sh "$PWD/release" "$PORT" "$RELEASE"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy of \`$RELEASE\`: ${{ job.status }}"
            echo "https://turkassen.mathiasspangsberg.com"
            echo
            echo "Releases on the Pi (roll back with Actions → Rollback):"
            echo '```'
            /opt/familyexpenses/bin/rollback.sh --list || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

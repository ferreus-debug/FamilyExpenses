name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Lint shell scripts
        run: shellcheck deploy/*.sh tests/e2e/run.sh

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish for Raspberry Pi (linux-arm64)
        run: >
          dotnet publish src/FamilyExpenses.Web/FamilyExpenses.Web.csproj
          --configuration Release --runtime linux-arm64 --self-contained
          --output artifacts/pi

      - uses: actions/upload-artifact@v4
        with:
          name: familyexpenses-linux-arm64
          path: artifacts/pi
          retention-days: 7

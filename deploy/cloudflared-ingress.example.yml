# The Pi's tunnel is locally managed: /home/ferreus/.cloudflared/config.yml (owned by ferreus).
# Add the hostname rule ABOVE the final catch-all, next to your other apps, then:
#   (DNS: proxied CNAME turkassen -> <tunnel-id>.cfargotunnel.com, already created)
#   sudo systemctl restart cloudflared
#
# Like the other apps, the tunnel sends the hostname to nginx on port 80 (deploy/nginx-familyexpenses.conf).
tunnel: <tunnel-id>
credentials-file: /home/ferreus/.cloudflared/<tunnel-id>.json

ingress:
  - hostname: turkassen.mathiasspangsberg.com
    service: http://localhost:80
  # - hostname: budget.mathiasspangsberg.com
  #   service: http://localhost:80
  - service: http_status:404

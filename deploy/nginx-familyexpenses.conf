# /etc/nginx/sites-available/familyexpenses – installed by install-pi.sh.
#
# An EXTRA server block next to the other apps on the Pi (budget, madplan, wowanalyser, …). All
# listen on port 80: Cloudflare Tunnel terminates TLS and forwards plain HTTP, and nginx picks the
# block by server_name. Without this block the hostname falls back to the first site (campinglog).

# cloudflared already sends X-Forwarded-Proto: https. Pass it on instead of $scheme (always http
# here), or the app would issue non-secure cookies and http:// invitation links.
map $http_x_forwarded_proto $familyexpenses_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name turkassen.mathiasspangsberg.com;

    location / {
        # 127.0.0.1, not localhost: the app only listens on IPv4 loopback.
        proxy_pass         http://127.0.0.1:5080;
        proxy_http_version 1.1;
        # Blazor Server runs the UI over a SignalR WebSocket; without these the page renders
        # but nothing reacts.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $familyexpenses_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
